<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Chandra Film Studio</title>
  <meta name="description" content="Thank you for contacting Chandra Film Studio. Your enquiry has been received." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#080808" />
  <link rel="icon" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .thankyou-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      text-align: center;
      background: #080808;
      color: #f5f1e8;
    }
    .thankyou-card {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid rgba(201, 166, 91, 0.35);
      background: rgba(255, 255, 255, 0.025);
    }
    .thankyou-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid #c9a65b;
      border-radius: 50%;
      color: #c9a65b;
      font-size: 2.2rem;
    }
    .thankyou-card h1 {
      margin-bottom: 14px;
      color: #c9a65b;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 500;
    }
    .thankyou-card p {
      margin: 0 auto 28px;
      max-width: 480px;
      color: #c8c3b9;
      line-height: 1.8;
    }
    .thankyou-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
</head>
<body>
  <main class="thankyou-page">
    <section class="thankyou-card">
      <div class="thankyou-mark" aria-hidden="true">✓</div>
      <p class="eyebrow">Chandra Film Studio</p>
      <h1>Thank You!</h1>
      <p>Your enquiry has been received successfully. Our team will contact you soon to discuss your event and availability.</p>
      <div class="thankyou-actions">
        <a href="/" class="btn btn-gold">Back to Home</a>
        <a href="https://wa.me/919798112812" class="btn btn-outline" target="_blank" rel="noopener">WhatsApp Us</a>
      </div>
    </section>
  </main>
</body>
</html>
